[package]
name = "simpool"
version = "0.1.1"
edition = "2024"
description = "A pool of iOS simulators, one per worktree, for developers and coding agents"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
